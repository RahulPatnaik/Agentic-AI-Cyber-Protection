[tool.poetry]
name = "wifi-guardian-system"
version = "0.1.0"
description = "Multi-agent WiFi threat detection system using Pydantic AI and Mistral AI"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
pydantic-ai = "^0.0"
pydantic = "^2.6"
pydantic-settings = "^2.0"
scapy = "^2.5"
scikit-learn = "^1.4"
fastapi = "^0.109"
uvicorn = {extras = ["standard"], version = "^0.27"}
sqlalchemy = "^2.0"
structlog = "^24.0"
httpx = "^0.26"
numpy = "^1.26"
pandas = "^2.2"
python-dotenv = "^1.0"
aiosqlite = "^0.19"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
pytest-cov = "^4.1"
black = "^24.0"
ruff = "^0.2"
mypy = "^1.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
